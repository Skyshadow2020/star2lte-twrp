name: TWRP star2lte build

# Builds TWRP 12.1 (omni) recovery for star2lte (Galaxy S9+ Exynos) with the
# FBE-decrypt stack, entirely on GitHub Actions — no local Linux needed.
# The committed device tree carries our own kernel as prebuilt (ROM-era
# fscrypt + Trustonic drivers) and the Samsung keymaster3/phh/Trustonic
# vendor blobs from the PE13 ROM. Final images are re-packed into the
# Samsung v0+DTBH format by tools/samsung_pack.py.

on:
  workflow_dispatch:
    inputs:
      lunch_target:
        description: "lunch target"
        required: false
        default: "twrp_star2lte-userdebug"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses-dev x11proto-core-dev libx11-dev lib32z-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 device-tree-compiler repo
          git config --global user.email "ci@localhost"
          git config --global user.name "CI"
          git config --global color.ui false

      - name: Sync twrp-12.1 (minimal aosp manifest, depth 1)
        run: |
          mkdir -p twrp && cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1 --depth=1
          for attempt in 1 2 3; do
            echo "sync attempt $attempt"
            if repo sync -c -j2 --no-clone-bundle --no-tags; then
              echo "sync OK"
              break
            fi
            [ "$attempt" = "3" ] && exit 1
            sleep 20
          done
          df -h .

      - name: Place tree and blobs
        run: ./setup-tree.sh

      - name: Build recovery
        run: |
          cd twrp
          source build/envsetup.sh
          lunch ${{ inputs.lunch_target }}
          mka recoveryimage -j4

      - name: Repack into Samsung boot format
        run: |
          python3 tools/samsung_pack.py \
            star2lte-twrp-base.img \
            twrp/out/target/product/star2lte/kernel \
            twrp/out/target/product/star2lte/ramdisk-recovery.img \
            device/samsung/star2lte/prebuilt/dt \
            twrp/out/target/product/star2lte/recovery-samsung.img || \
          python3 tools/samsung_pack.py \
            star2lte-twrp-base.img \
            twrp/out/target/product/star2lte/recovery.img.tmp.kernel \
            twrp/out/target/product/star2lte/ramdisk-recovery.img \
            device/samsung/star2lte/prebuilt/dt \
            twrp/out/target/product/star2lte/recovery-samsung.img

      - name: Upload recovery images
        uses: actions/upload-artifact@v4
        with:
          name: twrp-star2lte-decrypt
          path: |
            twrp/out/target/product/star2lte/recovery-samsung.img
            twrp/out/target/product/star2lte/recovery.img
          if-no-files-found: warn

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            twrp/out/error.log
            twrp/out/soong.log
          if-no-files-found: ignore
